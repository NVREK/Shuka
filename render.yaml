services:
  - type: web
    name: shuka-marketplace
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: shuka-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
